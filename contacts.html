                        <label class="f">Email<input name="email" type="email" required autocomplete="email"></label>
                        <label class="f">Date (if you have one)<input name="date" type="date"></label>
                        <label class="f">Message<textarea name="message" rows="5" required></textarea></label>
                        <button class="pill" type="submit">Send message</button>
